name: Pulse Companion builds
# Internal test builds of the Pulse apps on GitHub's runners (the VPS stays cool): Windows MSI/EXE and macOS DMG
# (Tauri), Android APK (Expo, durable Pulse test signing), the Chrome extension ZIP, plus screenshots of each app running
# on a real runner/emulator. Unsigned for Windows/macOS until the owner provides certificates.
on:
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'apps/mobile/**', 'apps/chrome-extension/**', 'packages/companion/**', 'packages/design-system/**', 'pnpm-lock.yaml', '.github/workflows/companion-builds.yml']
  workflow_dispatch:
    inputs:
      version:
        description: Optional version override for the controlled upgrade acceptance
        type: string
      notes:
        description: Short text Pip shows for this release
        type: string
      channel:
        type: choice
        options: [test, stable]
        default: test
      validation_only:
        description: Compile/test without signing or publication (never advances an update channel)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: companion-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - name: Require signing configuration
        if: ${{ !inputs.validation_only }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ANDROID_SIGNING_STORE_BASE64: ${{ secrets.ANDROID_SIGNING_STORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: node apps/desktop/scripts/check-release.mjs
      - id: version
        env: { GH_TOKEN: '${{ github.token }}', REQUESTED_VERSION: '${{ inputs.version }}' }
        run: echo "version=$(node apps/desktop/scripts/release-version.mjs "$REQUESTED_VERSION")" >> "$GITHUB_OUTPUT"
      - id: notes
        env: { REQUESTED_NOTES: '${{ inputs.notes }}' }
        run: |
          node --input-type=module -e 'import {execFileSync} from "node:child_process"; import {appendFileSync,readFileSync} from "node:fs"; const notes=(process.env.REQUESTED_NOTES||readFileSync("apps/desktop/WHATS_NEW.md","utf8")).trim().replace(/[\r\n]/g," ").slice(0,2000); appendFileSync(process.env.GITHUB_OUTPUT,`notes=${notes}\n`);'
  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows, bundles: 'nsis,msi', target: '' }
          - { os: macos-latest, platform: macos, bundles: 'app,dmg', target: universal-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - uses: dtolnay/rust-toolchain@stable
      # rust-toolchain.toml pins the toolchain; the universal Mac build needs both Apple targets on that toolchain.
      - if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/core
            apps/desktop/src-tauri
      - run: node apps/desktop/scripts/release-version.mjs "${{ needs.prepare.outputs.version }}"
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: node --test --test-concurrency=2 packages/companion/test/*.test.js
      - run: pnpm --dir apps/desktop run build && pnpm --dir apps/desktop test
      - run: cargo test -j2 --manifest-path apps/desktop/core/Cargo.toml
      - name: Build installers
        shell: bash
        env:
          CARGO_BUILD_JOBS: 2
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          VALIDATION_ONLY: ${{ inputs.validation_only }}
        run: |
          args=()
          if [ "$VALIDATION_ONLY" = true ]; then args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}'); fi
          pnpm --dir apps/desktop exec tauri build --bundles '${{ matrix.bundles }}' ${{ matrix.target && format('--target {0}', matrix.target) || '' }} "${args[@]}"
      - name: Screenshot the panel on the runner (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force screens | Out-Null
          $app = Start-Process -FilePath apps/desktop/src-tauri/target/release/pulse-desktop.exe -ArgumentList '--pinned' -PassThru
          Start-Sleep -Seconds 15
          Get-Process pulse-desktop -ErrorAction SilentlyContinue | Format-Table Id, MainWindowTitle, Responding
          if ($app.HasExited) { throw "Pulse exited with code $($app.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class PulseWindows { [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd); }'
          $app.Refresh(); $panel = $app.MainWindowHandle
          if ($panel -eq 0) { throw 'Pulse panel handle missing' }
          [System.Windows.Forms.SendKeys]::SendWait('^%p'); Start-Sleep -Seconds 2
          if ([PulseWindows]::IsWindowVisible($panel)) { throw 'Global shortcut did not hide the panel' }
          [System.Windows.Forms.SendKeys]::SendWait('^%p'); Start-Sleep -Seconds 2
          if (-not [PulseWindows]::IsWindowVisible($panel)) { throw 'Global shortcut did not reopen the panel' }
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screens/windows-desktop.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $app.Id -Force
      - name: Screenshot the panel on the runner (macOS)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p screens
          dmg=$(find apps/desktop/src-tauri/target -path '*bundle/dmg/*.dmg' -print -quit)
          test -n "$dmg"
          mkdir -p "$RUNNER_TEMP/pulse-mount"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/pulse-mount"
          app=$(find "$RUNNER_TEMP/pulse-mount" -maxdepth 2 -name '*.app' -print -quit)
          test -n "$app"
          "$app/Contents/MacOS/pulse-desktop" --pinned > screens/macos-app.log 2>&1 &
          app_pid=$!
          sleep 15
          kill -0 "$app_pid"
          screencapture -x screens/macos-desktop.png
          kill "$app_pid"
          hdiutil detach "$RUNNER_TEMP/pulse-mount"
      - uses: actions/upload-artifact@v7
        with:
          name: companion-desktop-${{ matrix.platform }}-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.sig
            apps/desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: companion-screens-${{ matrix.platform }}-${{ github.sha }}
          path: screens/
          if-no-files-found: ignore
          retention-days: 30

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - run: node apps/desktop/scripts/release-version.mjs "${{ needs.prepare.outputs.version }}"
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter @pulse/mobile typecheck && pnpm --filter @pulse/mobile test
      - run: pnpm --filter @pulse/mobile exec expo prebuild --platform android --no-install --clean
      - name: Load durable APK signing identity
        if: ${{ !inputs.validation_only }}
        env: { STORE_BASE64: '${{ secrets.ANDROID_SIGNING_STORE_BASE64 }}' }
        run: |
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP+"/pulse-signing.p12",Buffer.from(process.env.STORE_BASE64,"base64"),{mode:0o600})'
      - name: Build installable APK with bundled JavaScript
        working-directory: apps/mobile/android
        env:
          PULSE_ANDROID_KEYSTORE: ${{ !inputs.validation_only && format('{0}/pulse-signing.p12', runner.temp) || '' }}
          PULSE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -Dorg.gradle.parallel=false -PreactNativeArchitectures=arm64-v8a,x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: companion-android-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  android-screens:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v7
        with: { name: 'companion-android-${{ github.sha }}', path: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: |
            mkdir -p screens
            adb install -r apk/*.apk
            adb shell pm grant com.pulse.work.mobile android.permission.POST_NOTIFICATIONS || true
            adb shell am start -W -n com.pulse.work.mobile/.MainActivity; sleep 12; adb exec-out screencap -p > screens/android-start.png
            adb shell dumpsys appwidget > screens/android-widget-providers.txt
            for s in out in break done; do adb shell am start -W -a android.intent.action.VIEW -d "pulse://demo?state=$s" com.pulse.work.mobile; sleep 6; adb exec-out screencap -p > "screens/android-$s.png"; if [ "$s" = in ] || [ "$s" = break ]; then adb shell cmd statusbar expand-notifications; sleep 2; adb exec-out screencap -p > "screens/android-ribbon-$s.png"; adb shell cmd statusbar collapse; fi; done
            adb shell cmd uimode night yes; adb shell am start -W -a android.intent.action.VIEW -d "pulse://demo?state=in" com.pulse.work.mobile; sleep 6; adb exec-out screencap -p > screens/android-in-dark.png
      - uses: actions/upload-artifact@v7
        with:
          name: companion-screens-android-${{ github.sha }}
          path: screens/
          retention-days: 30

  ios-simulator:
    needs: prepare
    # Builds the Apple Silicon simulator app. The required ios-screens job verifies its UI unchanged.
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - run: node apps/desktop/scripts/release-version.mjs "${{ needs.prepare.outputs.version }}"
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter @pulse/mobile exec expo prebuild --platform ios --clean
      - name: Build the app scheme (not the first CocoaPods library scheme)
        run: |
          workspace=$(find apps/mobile/ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -jobs 2 -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/pulse-ios" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO -quiet
          app=$(find "$RUNNER_TEMP/pulse-ios/Build/Products" -maxdepth 2 -name '*.app' -print -quit)
          test -n "$app" && test -f "$app/Info.plist"
          test -s "$app/PlugIns/ExpoWidgetsTarget.appex/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist" | grep -qx com.pulse.work.mobile
          # Xcode embeds Simulator entitlements in __TEXT and signs locally; iOS restricted
          # entitlements must not be passed to a manual macOS codesign invocation.
          codesign --verify --deep --strict "$app"
          echo "IPHONE_APP=$app" >> "$GITHUB_ENV"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/pulse-ios-simulator.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: companion-ios-simulator-${{ github.sha }}
          path: ${{ runner.temp }}/pulse-ios-simulator.zip
          if-no-files-found: error
  ios-screens:
    needs: ios-simulator
    uses: ./.github/workflows/ios-simulator-acceptance.yml
    with:
      build_run: '${{ github.run_id }}'
      artifact_name: 'companion-ios-simulator-${{ github.sha }}'

  ios-device:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - run: node apps/desktop/scripts/release-version.mjs "${{ needs.prepare.outputs.version }}"
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter @pulse/mobile exec expo prebuild --platform ios --clean
      - name: Unsigned iPhone device build
        run: |
          workspace=$(find apps/mobile/ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -jobs 2 -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/pulse-device" CODE_SIGNING_ALLOWED=NO -quiet
          app=$(find "$RUNNER_TEMP/pulse-device/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          test -s "$app/PlugIns/ExpoWidgetsTarget.appex/Assets.car"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/pulse-ios-device-unsigned.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: companion-ios-device-${{ github.sha }}
          path: ${{ runner.temp }}/pulse-ios-device-unsigned.zip
          if-no-files-found: error

  chrome:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - run: node apps/desktop/scripts/release-version.mjs "${{ needs.prepare.outputs.version }}"
      - run: node apps/chrome-extension/scripts/sync-shared.mjs --check && node --test --test-concurrency=2 apps/chrome-extension/test/*.test.js
      - run: node apps/chrome-extension/scripts/package.mjs pulse-chrome.zip && node apps/chrome-extension/scripts/package.mjs pulse-chrome-web-store.zip
      - uses: actions/upload-artifact@v7
        with:
          name: companion-chrome-${{ github.sha }}
          path: |
            pulse-chrome.zip
            pulse-chrome-web-store.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, desktop, android, chrome, ios-simulator, ios-device, ios-screens]
    if: ${{ github.ref == 'refs/heads/main' && !inputs.validation_only }}
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - uses: actions/download-artifact@v7
        with: { path: artifacts, pattern: 'companion-*-${{ github.sha }}' }
      - name: Publish signed bundles then advance the channel manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.notes }}
          RELEASE_CHANNEL: ${{ inputs.channel || 'test' }}
        run: node apps/desktop/scripts/publish-release.mjs
