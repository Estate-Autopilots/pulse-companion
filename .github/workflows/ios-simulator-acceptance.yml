name: Verify built iPhone simulator
on:
  workflow_call:
    inputs:
      build_run: {required: true, type: string}
      artifact_name: {required: true, type: string}
  workflow_dispatch:
    inputs:
      build_run: {description: 'Public build run ID', required: true}
      artifact_name: {description: 'Simulator artifact name from that run', required: true}
permissions: {contents: read, actions: read}
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.build_run }}
          name: ${{ inputs.artifact_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: archive
      - name: Install the pinned UI test driver
        run: |
          curl -fL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Verify the unchanged app and all attendance screens
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN: ${{ inputs.build_run }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          MAESTRO_CLI_NO_ANALYTICS: '1'
          JAVA_TOOL_OPTIONS: '-XX:ActiveProcessorCount=2 -Xmx1536m'
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          mkdir -p screens "$RUNNER_TEMP/pulse-recheck"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq '{id,name,head_sha,head_branch}' > screens/build-run.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('screens/build-run.json'))
          assert r['name']=='Pulse Companion builds' and r['head_branch']=='main'
          assert os.environ['ARTIFACT_NAME']=='companion-ios-simulator-'+r['head_sha']
          PY
          ditto -x -k archive/pulse-ios-simulator.zip "$RUNNER_TEMP/pulse-recheck"
          app=$(find "$RUNNER_TEMP/pulse-recheck" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          udid=$(xcrun simctl list devices available -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$udid"
          open -a Simulator --args -CurrentDeviceUDID "$udid"
          xcrun simctl bootstatus "$udid" -b
          codesign -d --entitlements :- "$app" > screens/original-entitlements.plist 2>&1
          codesign --verify --deep --strict --verbose=4 "$app" > screens/original-verification.txt 2>&1
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" com.pulse.work.mobile > screens/original-launch.txt 2>&1
          sleep 15
          xcrun simctl io "$udid" screenshot screens/ios-start.png
          swiftc apps/mobile/scripts/ios-screen-check.swift -o "$RUNNER_TEMP/ios-screen-check"
          "$RUNNER_TEMP/ios-screen-check" screens/ios-start.png 'Sign in'
          python3 - <<'PY'
          import json
          lines=['appId: com.pulse.work.mobile','---','- launchApp']
          for state,text in [('out','Not checked in'),('in','Take a break'),('break','On a break'),('done','Done for today')]:
            lines += ['- openLink: '+json.dumps('pulse://demo?state='+state),'- tapOn:', '    text: "^Open$"','    optional: true','- tapOn:','    text: "^Allow$"','    optional: true','- assertVisible: '+json.dumps(text),'- takeScreenshot: ios-'+state]
          open('screens/attendance.yaml','w').write('\n'.join(lines)+'\n')
          PY
          maestro --device "$udid" test --test-output-dir screens --debug-output screens/maestro screens/attendance.yaml
          for s in out in break done; do
            case "$s" in out) expected='Not checked in';; in) expected='Take a break';; break) expected='On a break';; done) expected='Done for today';; esac
            shot=$(find screens -name "ios-$s.png" -print -quit)
            test -n "$shot"
            if [ "$shot" != "screens/ios-$s.png" ]; then cp "$shot" "screens/ios-$s.png"; fi
            "$RUNNER_TEMP/ios-screen-check" "screens/ios-$s.png" "$expected"
          done
          xcrun simctl ui "$udid" appearance dark
          cat > screens/dark.yaml <<'FLOW'
          appId: com.pulse.work.mobile
          ---
          - openLink: 'pulse://demo?state=in'
          - tapOn: {text: '^Open$', optional: true}
          - assertVisible: 'Take a break'
          - takeScreenshot: ios-in-dark
          - pressKey: Home
          - takeScreenshot: ios-island
          - pressKey: Lock
          - pressKey: Lock
          - takeScreenshot: ios-lock-screen
          FLOW
          maestro --device "$udid" test --test-output-dir screens --debug-output screens/maestro screens/dark.yaml
          for name in ios-in-dark ios-island ios-lock-screen; do
            shot=$(find screens -name "$name.png" -print -quit)
            test -n "$shot"
            if [ "$shot" != "screens/$name.png" ]; then cp "$shot" "screens/$name.png"; fi
          done
          "$RUNNER_TEMP/ios-screen-check" screens/ios-in-dark.png 'Take a break'
          xcrun simctl spawn "$udid" log show --last 5m --style compact --predicate 'process == "Pulse" OR eventMessage CONTAINS[c] "com.pulse.work.mobile"' > screens/surface-runtime.txt
          python3 - <<'PY'
          import hashlib,json,os
          r=json.load(open('screens/build-run.json'))
          proof={'buildRun':str(r['id']),'buildCommit':r['head_sha'],'artifactName':os.environ['ARTIFACT_NAME'],'archiveSha256':hashlib.sha256(open('archive/pulse-ios-simulator.zip','rb').read()).hexdigest(),'signatureUnchanged':True,'screens':['start','out','in','break','done','in-dark'],'checks':['Xcode signature verified','Keychain startup clean','native Open confirmation accepted','all four states and dark verified'],'activityScreens':['ios-island.png','ios-lock-screen.png']}
          open('screens/acceptance.json','w').write(json.dumps(proof,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: 'ios-simulator-diagnostics-${{ github.run_id }}', path: screens/, if-no-files-found: error}
